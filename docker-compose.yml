name: inforadar-mvp

services:
  postgres:
    container_name: inforadar-mvp-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inforadar_mvp
      POSTGRES_USER: inforadar_mvp
      POSTGRES_PASSWORD: inforadar_mvp
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inforadar_mvp -d inforadar_mvp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: inforadar-mvp-redis
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: inforadar-mvp-postgres-data
  redis_data:
    name: inforadar-mvp-redis-data
